# Installed as /etc/chromium.d/90-gpu. Sourced by /usr/bin/chromium-browser on every start.
# Sets GPU flags for Chromium in the sandbox.
# --use-vulkan enables the Vulkan backend for WebGPU (Dawn) on the NVIDIA GPU, which TSL/three.js
# WebGPU needs. Tested: WebGPU adapter NVIDIA Ampere, WebGL uploads clean, no DmaBuf errors.
# ANGLE on Vulkan (--use-angle=vulkan) was dropped: its DmaBuf import broke WebGL uploads.
CHROMIUM_GPU_FLAGS="--use-vulkan --enable-features=Vulkan,VaapiVideoDecoder --ignore-gpu-blocklist"
export CHROMIUM_FLAGS="$CHROMIUM_FLAGS $CHROMIUM_GPU_FLAGS"
