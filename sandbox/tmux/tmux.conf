# Shared tmux config. Installed as /etc/tmux.conf on the host and in the sandbox image,
# so every tmux server (host terminals and dev1-4) reads the same settings.

# Terminal: 256 colours and true colour for modern terminals
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-256color:RGB"

# Keep the default prefix (C-b); change here for everyone at once if needed
set -g prefix C-b

# Mouse: scroll, select panes and windows, resize by drag
set -g mouse on

# Scrollback and fast key response (no delay after Esc, important for editors)
set -g history-limit 100000
set -sg escape-time 10
set -g focus-events on

# Numbering starts at 1 and closes gaps when a window closes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Splits open in the current directory; vim-style pane movement with prefix + h/j/k/l
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload this file with prefix + r
bind r source-file /etc/tmux.conf \; display-message "tmux config reloaded"

# Status bar: host, session, window list, clock
set -g status-interval 10
set -g status-left "#[bold]#H #[default]» "
set -g status-right "%Y-%m-%d %H:%M "
set -g status-style "bg=colour235,fg=colour250"
setw -g window-status-current-style "fg=colour16,bg=colour39,bold"
